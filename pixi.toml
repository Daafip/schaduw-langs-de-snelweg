[workspace]
name = "shaduw-langs-de-snelweg"
version = "0.1.0"
description = "Shade detection at roadside stops (EU) from open satellite data"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]
readme = "README.md"
license = "GPL-3.0"
license-file = "LICENSE"

[tasks]
# Installation
install = "pre-commit install"

# Pipeline
run = "shaduw run --config configs/nl-prototype.toml"
run-full = "shaduw run --config configs/nl-full.toml --workers 8"
run-de = "shaduw run --config configs/de-full.toml --workers 8"
run-fr = "shaduw run --config configs/fr-full.toml --workers 8"
run-be = "shaduw run --config configs/be-full.toml --workers 8"
run-uk = "shaduw run --config configs/uk-full.toml --workers 8"
run-es = "shaduw run --config configs/es-full.toml --workers 8"
run-ch = "shaduw run --config configs/ch-full.toml --workers 8"
run-it = "shaduw run --config configs/it-full.toml --workers 8"
run-at = "shaduw run --config configs/at-full.toml --workers 8"
discover = "shaduw discover --country NL --out configs/seeds/nl-discovered.geojson"
discover-de = "shaduw discover --country DE --out configs/seeds/de-discovered.geojson"
discover-fr = "shaduw discover --country FR --out configs/seeds/fr-discovered.geojson"
discover-be = "shaduw discover --country BE --out configs/seeds/be-discovered.geojson"
discover-uk = "shaduw discover --country GB --out configs/seeds/uk-discovered.geojson"
discover-es = "shaduw discover --country ES --out configs/seeds/es-discovered.geojson"
discover-ch = "shaduw discover --country CH --out configs/seeds/ch-discovered.geojson"
discover-it = "shaduw discover --country IT --out configs/seeds/it-discovered.geojson"
discover-at = "shaduw discover --country AT --out configs/seeds/at-discovered.geojson"
merge-eu = "shaduw merge output/stops_shade.parquet output/de/stops_shade.parquet output/fr/stops_shade.parquet output/be/stops_shade.parquet output/uk/stops_shade.parquet output/es/stops_shade.parquet output/ch/stops_shade.parquet output/it/stops_shade.parquet output/at/stops_shade.parquet --out output/eu"
fetch-roads = "shaduw fetch-roads --countries NL DE FR BE GB ES CH IT AT --out configs/roads/eu-major-roads.geojson"
test = "pytest test -v"

# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs" ,inputs = [
    "docs/_quarto.yml",
    "src/shaduw_langs_de_snelweg",
    ],outputs = [
    "docs/reference/"
    ]}
quarto-preview = { cmd = "export QUARTO_PYTHON=python && quarto preview docs", depends-on = [
    "quartodoc-build",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
# no --execute: notebooks are committed with their outputs and rendered as-is
quarto-render = { cmd = "export QUARTO_PYTHON=python && quarto render docs --to html", depends-on = [
    "quartodoc-build",
] }
docs = { depends-on = ["quarto-preview"] }
pre-commit = "pre-commit run --all-files"

[tool.ruff]
# Ruff configuration, see https://docs.astral.sh/ruff/configuration/
#lint.ignore = [
    #"E501",  # Line too long
    #"F401",  # Unused import
    #"F403",  # 'from module import *' used; unable to detect undefined names
    #"F405",  # Name may be undefined, or defined from star imports: define
    #"F841",  # Local variable name is assigned to but never used
    #"T201",  # Use of print statement (use print() function instead)
#]

[dependencies]
python = ">=3.11"
ipykernel = "*"
ipywidgets = "*"
matplotlib = "*"
nbclient = "*"
nbformat = "*"
numpy = "*"
pandas = "*"
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
pydantic = ">=2.12.4,<3"
quarto = ">=1.5.57"
quartodoc = ">=0.9.1"
ruff = ">=0.8.1"
tqdm = "*"
# Geo / pipeline stack
geopandas = ">=1.0"
shapely = ">=2.0"
rioxarray = "*"
rasterio = "*"
xarray = "*"
pystac-client = "*"
odc-stac = "*"
pvlib = "*"
folium = "*"
pyarrow = "*"
python-duckdb = "*"
requests = "*"
# modern sqlite builds depend on libsqlite instead of bundling an old lib
# (the solver otherwise picks sqlite 3.32 via proj, breaking python's sqlite3)
sqlite = ">=3.46"

[pypi-dependencies]
shaduw_langs_de_snelweg = { path = "src", editable = true }
