[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "shaduw_langs_de_snelweg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["shaduw_langs_de_snelweg"]

[project]
name = "shaduw_langs_de_snelweg"
version = "0.1.0"
description = "Shade detection at roadside stops (EU) from open satellite data"
readme = "README.md"
license = {text = "GNU-GPL V3"}
authors = [
  { name = "David Haasnoot"},
]

dependencies = [
  "numpy",
  "pandas",
  "pydantic>=2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "rioxarray",
  "xarray",
  "pystac-client",
  "odc-stac",
  "pvlib",
  "folium",
  "pyarrow",
  "requests",
  "tqdm",
]

[project.scripts]
shaduw = "shaduw_langs_de_snelweg.cli:main"

[project.urls]
Source = "https://github.com/HKV-products-services/shaduw-langs-de-snelweg"
